# DELTA - Main NGINX Configuration
#
# This is the top-level, machine-wide NGINX configuration. It deliberately
# contains only the essentials - process/event tuning and the include that
# pulls in per-site virtual host configuration from conf.d\*.conf.
#
# The DELTA reverse proxy itself is NOT defined in this file - see:
#   conf.d\delta.conf
#
# Keeping site-specific configuration out of this file means it can be
# regenerated (by setup-nginx.ps1) without touching any other hand-written
# virtual host that might later be added alongside DELTA's own.
#
# The pid directive below is explicit and deliberate, not a stylistic
# preference - setup-nginx.ps1's own stop/reload/restart logic locates this
# file's master process via this exact path ($Script:NginxPidFilePath), and
# previously depended on nginx's compiled-in default pid location happening
# to agree with that. Pinning it here means the location is a documented
# fact both sides own, never an undocumented compiled default.
worker_processes  auto;

pid  logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile            on;
    keepalive_timeout    65;

    # Each site gets its own file under conf.d\ - DELTA's is delta.conf.
    include conf.d/*.conf;
}
