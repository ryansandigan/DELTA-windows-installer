# DELTA - NGINX Reverse Proxy Configuration
#
# This is the canonical DELTA virtual host. It is (re)generated by
# setup-nginx.ps1 - if you hand-edit this file, re-running that script will
# back up your changes (delta.conf.bak-<timestamp>) and overwrite this file
# with the version below, so make hand edits to a copy of this template
# under version control instead if you need them to persist.
#
# What this does:
#   - Listens on port 80 (plain HTTP) as the public entry point for DELTA.
#   - Forwards every request to the DELTA application server, which by
#     default listens on http://localhost:3000 - see PORT in
#     C:\DELTA\.env.
#   - Adds the standard reverse-proxy headers DELTA relies on to see the
#     real client IP, protocol, and host, since it never talks to the
#     browser directly once NGINX sits in front of it.
#
# IMPORTANT: if you change PORT in C:\DELTA\.env (e.g. PORT=3001, because
# 3000 is already in use), update proxy_pass below to match - NGINX has no
# way to discover that change automatically.

server {
    listen       80;
    server_name  localhost;

    location / {
        proxy_pass http://localhost:3000;

        # Required for keep-alive / WebSocket upgrades to the backend.
        proxy_http_version 1.1;

        # DELTA reads x-forwarded-for/x-real-ip directly rather than
        # relying on Express's "trust proxy" setting, so no additional
        # application-side configuration is required for these to work.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}

# -----------------------------------------------------------------------------
# HTTPS (disabled by default)
# -----------------------------------------------------------------------------
#
# HTTPS is not enabled out of the box - a certificate is a deployment-specific
# decision this installer cannot make for you. To enable it:
#
#   1. Obtain a certificate and key for your domain (e.g. from a CA, or
#      self-signed for testing) and place them under C:\nginx\certs\.
#   2. Uncomment both server blocks below and replace delta.example.org
#      with your actual domain name.
#   3. Re-run setup-nginx.ps1 (or `nginx -t` then `nginx -s reload`
#      yourself) to apply the change.
#
# server {
#     listen 80;
#     server_name delta.example.org;
#
#     # Redirect all plain HTTP traffic to HTTPS instead of proxying it.
#     return 301 https://$host$request_uri;
# }
