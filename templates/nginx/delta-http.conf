# DELTA - NGINX Reverse Proxy Configuration (HTTP)
#
# This is the canonical DELTA virtual host for a plain HTTP deployment - no
# SSL certificate was installed via setup-nginx.ps1's SSL Certificate Wizard,
# so this file (not delta-https.conf) is what that script generates. It is
# (re)generated on every run - if you hand-edit this file, re-running
# setup-nginx.ps1 will overwrite it, so make hand edits to a copy under
# version control instead if you need them to persist.
#
# What this does:
#   - Listens on port 80 (plain HTTP) as the public entry point for DELTA.
#   - Forwards every request to the DELTA application server - see the
#     DELTA Backend comment block below for the port this was generated
#     with.
#   - Adds the standard reverse-proxy headers DELTA relies on to see the
#     real client IP, protocol, and host, since it never talks to the
#     browser directly once NGINX sits in front of it.
#
# To serve DELTA over HTTPS instead, install an SSL certificate by running
# setup-nginx.ps1 again on a clean NGINX installation and answering "Yes"
# when asked whether you already have one - delta-https.conf is generated
# in place of this file automatically, with no manual template selection
# required.

server {
    listen       80;

    #
    # Public Website
    #
    # Domain:
    #
    #     __DELTA_SERVER_NAME__
    #
    # If the public hostname changes,
    # rerun setup-nginx.ps1 to regenerate
    # this configuration.
    #
    server_name  __DELTA_SERVER_NAME__;

    location / {
        #
        # DELTA Backend
        #
        # Generated from:
        #
        #     __DELTA_ENV_PATH__
        #
        # Backend Port:
        #
        #     __DELTA_BACKEND_PORT__
        #
        # If you later change the PORT value in
        # the DELTA .env file, rerun setup-nginx.ps1
        # to regenerate this configuration.
        #
        proxy_pass http://localhost:__DELTA_BACKEND_PORT__;

        # Required for keep-alive / WebSocket upgrades to the backend.
        proxy_http_version 1.1;

        # DELTA reads x-forwarded-for/x-real-ip directly rather than
        # relying on Express's "trust proxy" setting, so no additional
        # application-side configuration is required for these to work.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}
