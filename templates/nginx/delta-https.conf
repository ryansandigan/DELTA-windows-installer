# DELTA - NGINX Reverse Proxy Configuration (HTTPS)
#
# This is the canonical DELTA virtual host for an HTTPS deployment -
# generated instead of delta-http.conf whenever setup-nginx.ps1's SSL
# Certificate Wizard successfully installs a certificate. It is
# (re)generated on every run - if you hand-edit this file, re-running
# setup-nginx.ps1 will overwrite it, so make hand edits to a copy under
# version control instead if you need them to persist.
#
# What this does:
#   - Redirects all plain HTTP traffic (port 80) to HTTPS - DELTA is never
#     served unencrypted once a certificate has been installed.
#   - Listens on port 443 (HTTPS) as the public entry point for DELTA.
#   - Forwards every request to the DELTA application server - see the
#     DELTA Backend comment block below for the port this was generated
#     with.
#   - Adds the standard reverse-proxy headers DELTA relies on to see the
#     real client IP, protocol, and host, since it never talks to the
#     browser directly once NGINX sits in front of it.
#
# The certificate and private key are always read from their fixed,
# installed location under C:\nginx\certs\ - never the original files you
# selected in the SSL Certificate Wizard, which copied them here and are no
# longer referenced afterward.

server {
    listen       80;

    # Public Website domain - see the matching comment block on the 443
    # server block below for the full explanation. Kept in sync with it,
    # since both server blocks answer to the same public hostname.
    server_name  __DELTA_SERVER_NAME__;

    # Plain HTTP is not served directly - redirect everything to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;

    #
    # Public Website
    #
    # Domain:
    #
    #     __DELTA_SERVER_NAME__
    #
    # If the public hostname changes,
    # rerun setup-nginx.ps1 to regenerate
    # this configuration.
    #
    server_name  __DELTA_SERVER_NAME__;

    ssl_certificate     C:/nginx/certs/delta.crt;
    ssl_certificate_key C:/nginx/certs/delta.key;

    location / {
        #
        # DELTA Backend
        #
        # Generated from:
        #
        #     __DELTA_ENV_PATH__
        #
        # Backend Port:
        #
        #     __DELTA_BACKEND_PORT__
        #
        # If you later change the PORT value in
        # the DELTA .env file, rerun setup-nginx.ps1
        # to regenerate this configuration.
        #
        proxy_pass http://localhost:__DELTA_BACKEND_PORT__;

        # Required for keep-alive / WebSocket upgrades to the backend.
        proxy_http_version 1.1;

        # DELTA reads x-forwarded-for/x-real-ip directly rather than
        # relying on Express's "trust proxy" setting, so no additional
        # application-side configuration is required for these to work.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}
